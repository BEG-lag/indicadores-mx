[project]
name = "indicadores-mx"
version = "1.0.0"
description = "A living open dataset and free static JSON/CSV API of Mexico's official economic indicators, each value traceable to its Diario Oficial de la Federación publication."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín Esponda García" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://beg-lag.github.io/indicadores-mx/"
Repository = "https://github.com/BEG-lag/indicadores-mx"
Author = "https://pivotek.mx"

[project.scripts]
indicadores-mx = "indicadores_mx.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indicadores_mx"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.8",
]
screenshots = [
    "playwright>=1.48",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits the real SIDOF API (skipped unless INDICADORES_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/banner.py" = ["E501"] # the SVG template reads better unwrapped
"src/indicadores_mx/catalog.py" = ["E501"] # bilingual descriptions read better unwrapped
"scripts/readme.py" = ["E501"] # Markdown table templates
